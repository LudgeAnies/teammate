<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активация аккаунта на платформе Teammate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0056b3;
        }
        p {
            margin-bottom: 15px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет, {{ user.username }}!</h1>
        <p>Пожалуйста, перейди по следующей ссылке, чтобы активировать свой аккаунт:</p>
        <p><a class="button" href="{{ url }}">Активировать аккаунт</a></p>
        <p>Если кнопка выше не работает, скопируй и вставь следующую ссылку в свой браузер:</p>
        <p>{{ url }}</p>
        <p>С уважением,<br>Команда Teammate</p>
    </div>
</body>
</html>
