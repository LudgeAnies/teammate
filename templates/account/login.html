{% extends "base.html" %}
{% load socialaccount %}

{% block content %}
<div class="auth-container">
    <h2>Вход в систему</h2>
    <form method="post" action="{% url 'account_login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="login">Email или имя пользователя</label>
            <input type="text" name="login" id="login" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" name="password" id="password" required>
        </div>
        <div class="form-group recaptcha-group">
            {{ form.captcha }}
            {{ form.captcha.errors }}
        </div>

        {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
        {% endif %}

        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <div class="auth-links">
        <a href="{% url 'account_reset_password' %}">Забыли пароль?</a>
        <a href="{% url 'account_signup' %}">Регистрация</a>
        <a href="{% provider_login_url 'google' %}">Войти через Google</a>
    </div>
</div>
{% endblock %}
