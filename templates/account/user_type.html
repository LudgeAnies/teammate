{% extends "base.html" %}

{% block content %}
  <h1>Выберите тип пользователя</h1>

  {% if error_message %}
    <p style="color: red;">{{ error_message }}</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {% for value, label in user_type_choices %}
      <label>
        <input type="radio" name="user_type" value="{{ value }}"> {{ label }}
      </label><br>
    {% endfor %}
    <button type="submit">Сохранить выбор</button>
  </form>
{% endblock %}
