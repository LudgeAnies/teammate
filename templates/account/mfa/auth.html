{% extends "base.html" %}

{% block title %}Двухфакторная аутентификация{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>Требуется двухфакторная аутентификация</h3>
            </div>
            <div class="card-body">
                <p>Пожалуйста, введите 6-значный код из вашего приложения для проверки подлинности:</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Далее</button>
                </form>

                <div class="mt-3">
                    <a href="{% url 'mfa_reauthenticate' %}">Use another method</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
